
name: Build Signed Android App Bundle (Native Android)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:

      # Step 1: Check out repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Step 3: Generate Android App Icons
      - name: Generate Android App Icons
        run: |
          set -euo pipefail

          if [ ! -f app-icon.png ]; then
            echo "ERROR: app-icon.png not found in repository root."
            exit 1
          fi

          # Install ImageMagick
          sudo apt-get update
          sudo apt-get install -y imagemagick

          # Verify icon dimensions
          WIDTH=$(identify -format '%w' app-icon.png)
          HEIGHT=$(identify -format '%h' app-icon.png)

          if [ "$WIDTH" != "$HEIGHT" ]; then
            echo "ERROR: App icon must be square."
            exit 1
          fi

          # Create Android resource directories
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$density"
          done

          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          # Generate standard launcher icons
          convert app-icon.png -resize 48x48 \
            app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert app-icon.png -resize 72x72 \
            app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert app-icon.png -resize 96x96 \
            app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert app-icon.png -resize 144x144 \
            app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert app-icon.png -resize 192x192 \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # Generate adaptive foreground icons
          convert app-icon.png -resize 108x108 \
            app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png

          convert app-icon.png -resize 162x162 \
            app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png

          convert app-icon.png -resize 216x216 \
            app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png

          convert app-icon.png -resize 324x324 \
            app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png

          convert app-icon.png -resize 432x432 \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

          # Create adaptive icon XML
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # Create adaptive round icon XML
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # Create background color resource
          cat > app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          EOF

          echo "Android launcher icons generated successfully."

      # Step 4: Validate signing and Firebase secrets
      - name: Validate Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD GOOGLE_SERVICES_JSON; do
            if [ -z "${!name}" ]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

      # Step 5: Configure Keystore, key.properties, and Firebase
      - name: Configure Android Signing and Firebase
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          mkdir -p app

          # Decode keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks

          # Configure Firebase
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

          # Generate signing properties
          cat > key.properties <<EOF
          storeFile=app/upload-keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          EOF

          cp key.properties app/key.properties

          # Enable AndroidX
          touch gradle.properties

          if ! grep -q "^android.useAndroidX=true" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=true" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

      # Step 6: Set up Gradle
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Step 7: Ensure Gradle wrapper exists
      - name: Ensure Gradle wrapper exists
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.14.3 --distribution-type all
          fi

          chmod +x gradlew

      # Step 8: Build signed Release AAB
      - name: Build with Gradle
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          SIGNING_STORE_FILE: upload-keystore.jks
        run: |
          ./gradlew clean bundleRelease --stacktrace

      # Step 9: Upload signed AAB
      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # Step 10: Upload generated Android icons
      - name: Upload Generated App Icons
        uses: actions/upload-artifact@v4
        with:
          name: heavenly-stream-android-icons
          path: app/src/main/res/mipmap-*
          if-no-files-found: error
          retention-days: 14
